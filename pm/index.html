<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sienna Aylaian · Product</title>
<meta name="description" content="Sienna Aylaian: product management portfolio. Quantitative Social Science, Dartmouth '28.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Light only. Teal accent + swirl ornament are a nod to the main portfolio. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#eef5f5; --surface-2:#dcebeb; --border:#c5d4d5;
  --text:#0a1413; --muted:#2c3a39; --subtle:#4b5a59;
  --accent:#11494c; --accent-soft:#d9ecea; --aqua:#bfe2e2;
  --radius:4px; --serif:"Newsreader",Georgia,serif; --max:1080px; --gutter:24px;
}
/* Swirl ornament, tinted via mask so it can take any color */
.ornament{position:absolute;pointer-events:none;background:var(--accent);
  -webkit-mask:url(assets/swirl.png) center/contain no-repeat;mask:url(assets/swirl.png) center/contain no-repeat}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
h1,h2,h3{line-height:1.2;letter-spacing:-.01em;margin:0}
h1,h2,.metric b,blockquote{font-family:var(--serif);font-weight:500!important;letter-spacing:-.005em}

/* header */
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{font-family:var(--serif);font-weight:500;text-decoration:none;font-size:19px}
nav.main{display:flex;gap:24px;font-size:14px}
nav.main a{text-decoration:none;color:var(--muted)}
nav.main a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:3px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--border);background:var(--bg);color:var(--text);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}

/* hero */
.hero-bg{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--aqua) 0%,#eef7f7 38%,var(--bg) 100%);margin-bottom:0}
.hero-bg .o1{width:340px;height:340px;top:-40px;right:-60px;opacity:.22}
.hero-bg .o2{width:260px;height:260px;bottom:-20px;left:-70px;opacity:.18;transform:scale(-1,-1)}
.hero{position:relative;padding:80px 0 64px;display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:center}
.eyebrow{font-size:14px;font-weight:500;color:var(--subtle);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.hero h1{font-size:clamp(30px,3.8vw,40px);line-height:1.15;margin-bottom:18px}
.hero p.lede{font-size:16.5px;color:var(--muted);max-width:600px;margin:0 0 28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.portrait-wrap{position:relative}
.portrait-wrap .o3{width:130px;height:130px;right:-34px;bottom:-34px;opacity:.55}
.portrait{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;background:var(--surface);box-shadow:0 10px 30px rgba(29,100,103,.14)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}

/* sections */
section.block{padding:64px 0;border-top:1px solid var(--border)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:32px}
.sec-head h2{font-size:28px}
.sec-head p{margin:6px 0 0;color:var(--muted);font-size:15px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.metric{padding:22px 22px 20px;border-right:1px solid var(--border)}
.metric:last-child{border-right:0}
.metric b{display:block;font-size:26px;line-height:1.15;color:var(--accent)}
.metric span{display:block;font-size:14.5px;color:var(--muted);margin-top:4px;line-height:1.45}

/* project cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.card{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;text-decoration:none;background:var(--bg);transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));box-shadow:0 4px 18px rgba(16,24,40,.06)}
.card .thumb{aspect-ratio:16/9;background:var(--surface);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--border)}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .thumb.contain img{object-fit:contain;padding:16px 0 0;object-position:50% 0}
.card .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .org{font-size:14px;font-weight:500;color:var(--subtle)}
.card h3{font-size:18px;font-weight:600;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:15.5px}
.card .result{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:14px;color:var(--text)}
.card .result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card .result div{font-size:13.5px;line-height:1.35;color:var(--muted)}
.card .result strong{display:block;font-family:var(--serif);font-weight:500;font-size:19px;color:var(--accent);margin-bottom:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:500;padding:3px 9px;border-radius:2px;background:var(--surface-2);color:var(--muted)}
.subhead{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);margin:40px 0 16px}
.subhead:first-of-type{margin-top:0}

/* experience */
.exp{display:grid;gap:0}
.exp-row{display:grid;grid-template-columns:200px 1fr;gap:32px;padding:22px 0;border-bottom:1px solid var(--border)}
.exp-row:first-child{padding-top:0}
.exp-row:last-child{border-bottom:0}
.exp-when{font-size:14px;color:var(--subtle)}
.exp-row h3{font-size:16px;font-weight:600}
.exp-row .org{color:var(--muted);font-size:15px;margin-top:2px}
.exp-row ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.exp-row li{margin:4px 0}

/* about */
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:56px}
.about p{color:var(--muted);margin:0 0 16px}
.skills{display:grid;gap:20px}
.skills h3{font-size:14px;font-weight:600;margin-bottom:8px}

/* contact / footer */
.sec-head h2::after{content:"";display:block;width:36px;height:2px;background:var(--accent);margin-top:10px;border-radius:2px}
.metrics{background:var(--bg)}
.contact{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--border);border-radius:var(--radius);padding:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.contact .o4{width:200px;height:200px;right:-40px;top:-50px;opacity:.2}
.contact > div{position:relative}
.cs-top{position:relative;overflow:hidden;background:linear-gradient(180deg,#eaf5f5 0%,var(--bg) 100%)}
.cs-top .o5{width:280px;height:280px;top:-50px;right:-50px;opacity:.2}
.contact h2{font-size:26px;margin-bottom:6px}
.contact p{margin:0;color:var(--muted)}
footer{padding:32px 0 48px;color:var(--subtle);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* case study */
.cs-back{display:inline-block;margin:32px 0 0;font-size:14px;color:var(--muted);text-decoration:none}
.cs-back:hover{color:var(--text)}
.cs-head{padding:28px 0 32px;max-width:780px}
.cs-head h1{font-size:clamp(28px,3.4vw,36px);line-height:1.15;margin:0 0 12px}
.cs-head p{font-size:16.5px;color:var(--muted);margin:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:40px}
.fact{padding:16px 16px 16px 0}
.fact dt{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle);margin-bottom:4px}
.fact dd{margin:0;font-size:14px}
.tldr{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px}
.tldr div{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.tldr h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:8px}
.tldr p{margin:0;font-size:15.5px;color:var(--text)}
.cs-links{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:48px}
.cs-body{max-width:780px}
.cs-body h2{font-size:24px;margin:48px 0 14px;padding-top:24px;border-top:1px solid var(--border)}
.cs-body h2:first-child{margin-top:0}
.cs-body p{color:var(--muted);margin:0 0 16px}
.cs-body p strong,.cs-body li strong{color:var(--text);font-weight:600}
.cs-body ul{color:var(--muted);padding-left:20px;margin:0 0 16px}
.cs-body li{margin:6px 0}
.cs-body .metrics{margin:8px 0 24px}
.cs-body blockquote{margin:20px 0;padding:4px 0 4px 20px;border-left:2px solid var(--accent);color:var(--text);font-size:19px;line-height:1.45;font-style:italic}
.cs-body blockquote cite{display:block;margin-top:8px;font-size:14px;font-style:normal;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--subtle)}
.table{width:100%;border-collapse:collapse;font-size:15.5px;margin:4px 0 24px}
.table th,.table td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--border);vertical-align:top}
.table th{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle)}
.table td{color:var(--muted)}
.table td:first-child{color:var(--text);font-weight:500}
.figs{display:grid;gap:16px;margin:8px 0 28px}
.figs.c1{grid-template-columns:1fr}
.figs.c2{grid-template-columns:repeat(2,1fr)}
.figs.c3{grid-template-columns:repeat(3,1fr)}
.figs.c4{grid-template-columns:repeat(4,1fr)}
figure{margin:0}
figure .frame{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.figs.phone figure .frame{padding:16px}
.figs.phone img{max-height:440px;width:auto}
figure img{cursor:zoom-in}
figcaption{font-size:14px;color:var(--subtle);margin-top:8px;line-height:1.45}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:64px 0 0;padding-top:32px;border-top:1px solid var(--border)}
.pager a{display:block;padding:18px 20px;border:1px solid var(--border);border-radius:var(--radius);text-decoration:none}
.pager a:hover{background:var(--surface)}
.pager small{display:block;font-size:13px;color:var(--subtle);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pager .next{text-align:right;grid-column:2}

/* résumé viewer */
.rv-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding:8px 0 24px}
.rv-head h1{font-size:clamp(28px,3.4vw,36px)}
.rv-page{background:#fff;border:1px solid var(--border);box-shadow:0 8px 28px rgba(10,20,19,.10);max-width:860px;margin:0 auto 64px}
.rv-page img{width:100%;height:auto}
.lb{position:fixed;inset:0;background:rgba(10,12,16,.86);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:2px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:32px;padding:48px 0 48px}
  .portrait-wrap{max-width:280px;order:-1}
  .portrait{aspect-ratio:1}
  .hero-bg .o1{width:220px;height:220px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .metric:nth-child(2){border-right:0}
  .metric:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .cards{grid-template-columns:1fr}
  .about{grid-template-columns:1fr;gap:32px}
  .exp-row{grid-template-columns:1fr;gap:4px}
  .facts{grid-template-columns:repeat(2,1fr)}
  .tldr{grid-template-columns:1fr}
  .figs.c3,.figs.c4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  :root{--gutter:16px}
  nav.main{gap:16px}
  nav.main a.hide-sm{display:none}
  .figs.c2{grid-template-columns:1fr}
  .figs.phone.c2{grid-template-columns:repeat(2,1fr)}
  .contact{padding:28px 22px}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:1}
  section.block{padding:48px 0}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">Sienna Aylaian</a>
    <nav class="main">
      <a href="#/work">Work</a>
      <a href="#/experience" class="hide-sm">Experience</a>
      <a href="#/about" class="hide-sm">About</a>
      <a href="#/resume">Résumé</a>
      <a href="#/contact">Contact</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>© 2026 Sienna Aylaian</span>
    <span>Hanover, NH · San Francisco Bay Area</span>
  </div>
</footer>

<div class="lb" id="lb"><img alt=""></div>

<script>
const EMAIL = 'sienna.aylaian@gmail.com';
const LINKEDIN = 'https://www.linkedin.com/in/sienna-aylaian-b21998273/';
const RESUME = 'assets/sienna-aylaian-resume-pm.pdf';
const RESUME_IMG = 'assets/resume-pm.png';
const A = f => 'assets/' + f;

/* Case studies. Block types: h, p, ul, quote, metrics, table, figs */
const PROJECTS = [
{
  id:'lavahire', group:'product',
  org:'LavaHire · Summer 2026',
  title:'Taking a recruiting platform from empty repo to production',
  summary:'Founding product designer on a two-person team. I scoped, designed, and built a hiring platform end to end in 10 weeks.',
  cover:A('777bab45006ee52f.png'),
  tags:['0→1','Discovery','Execution','Full-stack'],
  result:[['5+','features shipped end to end'],['111','automated tests passing'],['10 wks','empty repo to live MVP']],
  facts:{Role:'Founding Product Designer (design, roadmap, strategy)', Team:'2 (with founder Mike Pope)', Timeline:'May – Aug 2026, remote', Tools:'Figma, FigJam, Claude Code, Next.js, Supabase'},
  tldr:{
    Problem:'A contract recruiter had spent years trying to build his own hiring software and needed someone to give the product shape and ship it.',
    Approach:'Ran discovery in FigJam, framed one guiding problem around fair screening, wireframed every flow, then built and shipped it in Next.js and Supabase.',
    Outcome:'Live production MVP with 5+ features, including an AI-integrated two-stage questionnaire, plus a Figma design system and spec docs that kept scope aligned with delivery.'
  },
  links:[['Try the live demo','https://lavahire-demo.vercel.app/login']],
  body:[
    {t:'h',x:'Context'},
    {t:'p',x:'LavaHire is recruiting software founded by Mike Pope, a contract recruiter. I joined when the repository was still empty and worked with Mike fully remote across an 11-hour time difference. I owned the product from research through production.'},
    {t:'h',x:'Discovery and problem framing'},
    {t:'p',x:'Before designing any screens, I ran an empathize-and-define pass in FigJam:'},
    {t:'ul',x:['<strong>Stakeholder mapping</strong> across recruiters, candidates, and legal.','<strong>Competitive audit</strong> of LinkedIn, Handshake, and Indeed application flows.','<strong>Secondary research</strong> on bias in hiring.']},
    {t:'p',x:'One finding became the guiding constraint for the product: visa sponsorship questions are a real business need, but when asked poorly they become a proxy for bias against foreign-sounding names.'},
    {t:'quote',x:'How might we screen for a real constraint without inviting a hidden judgment call?',c:'Problem statement that guided feature decisions'},
    {t:'figs',items:[[A('1a9b3e7435b0acca.png'),'Stakeholder map from the FigJam discovery board.']]},
    {t:'h',x:'Scope and delivery'},
    {t:'p',x:'I sequenced the work so the riskiest decisions were settled before code: grayscale wireframes for every flow, then the build, with visual identity applied last once the flows were stable.'},
    {t:'table',head:['Feature','What it does'],rows:[
      ['Job posting flow','Four-step wizard with plain-language copy; the entry point for every recruiter.'],
      ['Apply experience','Resume upload and application handling for every candidate.'],
      ['Screening questionnaires','The largest feature. Grew into an AI-integrated, two-stage flow with its own invite emails.'],
      ['Candidate FAQ','Applicant questions answered directly by the recruiter.'],
      ['Review dashboard','Staff view for reviewing candidates; design started, more planned.']
    ]},
    {t:'figs',cols:2,items:[[A('eb8105cbe1a44e48.png'),'Wireframe: job posting wizard.'],[A('69b676a4190bd209.png'),'Wireframe: recruiter empty state.'],[A('0e69bd571bb9e3ca.png'),'Wireframe: questionnaire builder.'],[A('5875eb67c3508cbf.png'),'Wireframe: public candidate FAQ.']]},
    {t:'figs',cols:2,items:[[A('777bab45006ee52f.png'),'Production: public apply page.'],[A('22f94fae3863fe65.png'),'Production: careers site.']]},
    {t:'h',x:'Keeping scope and delivery aligned'},
    {t:'p',x:'As the only designer and the primary builder, I documented decisions so the founder and I stayed aligned on what we were shipping and why.'},
    {t:'ul',x:['<strong>Written product specs</strong> for each feature before implementation.','<strong>Flow diagrams and decision logs</strong> recording trade-offs and what was deferred.','<strong>A Figma design system</strong> with color tokens, light/dark theming, and typography, so new screens stayed consistent as scope grew.']},
    {t:'h',x:'Results'},
    {t:'metrics',items:[['95','commits shipped to production'],['~9,000','lines of TypeScript / React'],['111','automated tests, all passing'],['10','weeks, part-time and remote']]},
    {t:'quote',x:'I have been trying to build some version of a recruiting software application on my own for more than ten years. Working with Sienna gave the project the focus it had always lacked.',c:'Mike Pope, Founder, LavaHire'},
    {t:'h',x:'What I took away'},
    {t:'p',x:'Owning both the product decisions and the build made trade-offs concrete: every feature had a real cost in time, so scoping and sequencing mattered as much as the design itself.'}
  ]
},
{
  id:'reimagining-drill', group:'product',
  org:'Design Initiative at Dartmouth · Spanish & Portuguese Dept · 2025',
  title:'Piloting a mentorship program the department adopted',
  summary:'Led research and ran two live pilots to address retention among the department’s 32 peer drill instructors.',
  cover:A('af7b23b5845c30a0.jpg'),
  tags:['Discovery','Experimentation','Stakeholders'],
  result:[['60+','students per term in adopted program'],['30+','interviews synthesized'],['100%','of pilot participants would return']],
  facts:{Role:'Research lead + prototyping', Team:'4-person team + faculty partner', Timeline:'10 weeks', Methods:'Interviews, surveys, live pilots'},
  tldr:{
    Problem:'Experienced drill instructors were disengaging: they re-tried out and re-trained every term and felt little recognition or connection.',
    Approach:'Synthesized 30+ interviews and survey data, then tested peer mentorship as a live program over two iterated pilot rounds.',
    Outcome:'Mentorship model adopted department-wide, serving 60+ students per term, alongside curriculum changes reaching 300+ students annually.'
  },
  links:[['View the full deck','https://docs.google.com/presentation/d/1ryaUmndq_-8o8F9q9Ni3pXB7dsOZJ4JowTgMRKbU']],
  body:[
    {t:'h',x:'Context'},
    {t:'p',x:'Dartmouth’s Spanish & Portuguese Department runs “drill,” small peer-led language practice sections taught by about 32 student instructors. Every term, every instructor re-tries out and re-trains from scratch, regardless of experience. Our faculty partner, Roberto, brought us in to understand why instructors were checking out.'},
    {t:'h',x:'Problem statement'},
    {t:'quote',x:'Drill instructors need to feel valued and supported by the department, but the reapplication process and lack of recognition hurt their sense of belonging and development.',c:'Defined from interviews with instructors like “Alex,” a veteran instructor since freshman year'},
    {t:'h',x:'My role'},
    {t:'ul',x:['<strong>Stakeholder management:</strong> met with our partner weekly to share findings and gauge what the department could realistically support.','<strong>Research synthesis:</strong> turned interview notes, training observations, and survey data into findings the team could design against.','<strong>Pilot operations:</strong> recruited the first mentor and wrote the participant agreement.','<strong>Iteration:</strong> redesigned round two based on round-one results.']},
    {t:'h',x:'Key insights'},
    {t:'metrics',items:[['30+','student interviews synthesized'],['65%','of instructors lacked relationships with peers outside training'],['5 hrs','of first-week training cited as the #1 reason not to reapply'],['2','live pilot rounds']]},
    {t:'quote',x:'Returning instructors know how drill is; faculty just understands it as a concept.',c:'Instructor interview'},
    {t:'h',x:'Experiments'},
    {t:'p',x:'We tested peer mentorship as a real, running program rather than a mockup, recruiting actual mentors and mentees and tracking check-ins.'},
    {t:'table',head:['Round','Setup','Worked','Didn’t'],rows:[
      ['Round 1','Full term · 1 mentor : 4 mentees','Low-commitment check-ins were easy to sustain.','Larger group was hard to schedule; mentor role was unclear, so check-ins were never sent.'],
      ['Round 2','2 weeks · 1 mentor : 2 mentees','Easier coordination; mentor was fully engaged and understood the role.','Conversation stalled when one person went quiet.']
    ]},
    {t:'p',x:'<strong>Learning:</strong> group size was not the real variable. What mattered was whether the mentor clearly understood their role, so the recommendation focused on defining expectations.'},
    {t:'h',x:'Recommendation'},
    {t:'ul',x:['<strong>Mentor expectations:</strong> check-ins a few times a week over text, plus two in-person meetups per term.','<strong>Selection:</strong> mentors apply at the start of term; new instructors are auto-enrolled as mentees.','<strong>Tryouts:</strong> new instructors keep full training; experienced instructors attend one refresher and mentor instead.']},

function block(b){
  switch(b.t){
    case 'h': return `<h2>${b.x}</h2>`;
    case 'p': return `<p>${b.x}</p>`;
    case 'ul': return `<ul>${b.x.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'quote': return `<blockquote>“${b.x}”${b.c?`<cite>${b.c}</cite>`:''}</blockquote>`;
    case 'metrics': return metrics(b.items);
    case 'table': return `<table class="table"><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    case 'figs': return `<div class="figs c${b.cols||1}${b.phone?' phone':''}">${b.items.map(([src,cap])=>`<figure><div class="frame"><img src="${src}" alt="${cap}" loading="lazy"></div><figcaption>${cap}</figcaption></figure>`).join('')}</div>`;
  }
  return '';
}

let lastView = '';
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const m = h.match(/^work\/(.+)$/);
  const p = m && PROJECTS.find(x=>x.id===m[1]);
  if(h==='resume'){
    $app.innerHTML = resume(); lastView = 'resume';
    document.title = 'Résumé · Sienna Aylaian';
    window.scrollTo(0,0);
    return;
  }
  if(p){
    $app.innerHTML = study(p); lastView = 'study';
    document.title = p.title + ' · Sienna Aylaian';
    window.scrollTo(0,0);
    return;
  }
  if(lastView!=='home'){ $app.innerHTML = home(); lastView = 'home'; }
  document.title = 'Sienna Aylaian · Product';
  const target = h && document.getElementById(h);
  if(target) target.scrollIntoView(); else window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();

const lb = document.getElementById('lb');
document.addEventListener('click', e=>{
  const img = e.target.closest('figure img');
  if(img){ lb.firstElementChild.src = img.src; lb.classList.add('on'); }
  else if(e.target.closest('#lb')) lb.classList.remove('on');
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') lb.classList.remove('on'); });
